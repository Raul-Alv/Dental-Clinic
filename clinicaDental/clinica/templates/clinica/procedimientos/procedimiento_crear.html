{% extends 'layout.html' %}
{% load widget_tweaks %}
{% load static %}
{% block title %}
   <title>Show Page</title>
{% endblock %}

{% block content %}
<h2>{{ title|default:"Form" }}</h2>
<div class="card shadow-sm">
    <div class="card-body p-4">
      <form method="post" class="needs-validation" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
      </form>
    </div>
</div>

{% if form.errors %}
  <div class="alert alert-danger">
    <strong>Error!</strong> Please correct the errors below.
  </div>
{% endif %}

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('id_codigo');
    const codeInput = document.getElementById('id_codigo_text');
    function updateCode() {
      const opt = select.options[select.selectedIndex];
      codeInput.value = opt.getAttribute('data-code') || '';
    }
    select.addEventListener('change', updateCode);
    updateCode();
  });
</script>

{% endblock %}
