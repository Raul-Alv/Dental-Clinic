{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  {% block title %}
    <title>Mi App Profesional</title>
  {% endblock %}
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5.3 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-…" crossorigin="anonymous"
  >

  <!-- Tus estilos personalizados -->
  <link
    rel="stylesheet"
    href="{% static 'css/style.css' %}"
  >
  <link
    rel="stylesheet"
    href="{% static 'css/procedimientos_list.css' %}"
  >
</head>
<body>
   <nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">CRUD APP</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        
        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="procedimientosDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Procedimientos
          </a>
          <ul class="dropdown-menu" aria-labelledby="procedimientosDropdown">
            <li><a class="dropdown-item" href="{% url 'procedimiento_list' %}">Lista</a></li>
            <li><a class="dropdown-item" href="{% url 'procedimiento_crear' %}">Crear</a></li>
          </ul>
        </li>

        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="pacientesDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Pacientes
          </a>
          <ul class="dropdown-menu" aria-labelledby="pacientesDropdown">
            <li><a class="dropdown-item" href="{% url 'pacientes_list' %}">Lista</a></li>
            <li><a class="dropdown-item" href="{% url 'pacientes_crear' %}">Crear</a></li>
          </ul>
        </li>

        <li class="nav-item dropdown">
          <a
            class="nav-link dropdown-toggle"
            href="#"
            id="dentistasDropdown"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Dentistas
          </a>
          <ul class="dropdown-menu" aria-labelledby="dentistasDropdown">
            <li><a class="dropdown-item" href="{% url 'practicantes_list' %}">Lista</a></li>
            <li><a class="dropdown-item" href="{% url 'practicantes_crear' %}">Crear</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'import_data' %}">Importar</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{% url 'export_historial' %}">Exportar historial</a>
        </li>

      </ul>
    </div>
  </div>
</nav>

  <div class="container mt-4">
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap 5.3 Bundle (JS + Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-…" crossorigin="anonymous"
  ></script>

  <!-- Tu JavaScript personalizado -->
  <script
    src="{% static 'js/script.js' %}"
  ></script>
  </body>
</html>
